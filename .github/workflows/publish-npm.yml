name: Publish amz-cli to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  # npm 信任发布(Trusted Publishing/OIDC):CI 用短期 OIDC 凭证直接发布,
  # 不需要在 GitHub 存任何 npm token。npmjs.com 包设置里需一次性登记本工作流。
  id-token: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amz-cli
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # npm@latest(信任发布需要)要求 Node 22+;项目 engines >=20,22 兼容
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: amz-cli/package-lock.json

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const p=require('./package.json'); if (process.env.RELEASE_TAG !== 'v'+p.version) { throw new Error('tag '+process.env.RELEASE_TAG+' does not match package v'+p.version); }"

      # 信任发布要求 npm CLI ≥ 11.5;Node 20 自带的是 10.x,必须先升级
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
      # 无 token:凭 OIDC 身份发布(需先在 npmjs.com 包设置里登记本仓库+工作流)
      - run: npm publish --access public
